# ~/.tmux.conf - bdr193 dotfiles
#
# Primary goal: copy/paste that behaves like a local terminal.
# Mouse is OFF so the terminal (e.g. Ghostty) owns text selection: drag to
# select + Cmd+C copies to the system clipboard, Cmd+V pastes. Copy-mode copies
# reach the clipboard too, via OSC 52 (see below).
#
# Scroll the scrollback with:  <prefix> [   then PageUp / arrows   (q to exit).
#
# Phones (Termius, Blink, Termux): with the mouse off a swipe has nothing to
# scroll (tmux draws on the alternate screen) and a finger can't hold a selection
# while scrolling. So a phone attaches to a GROUPED session: same windows, its
# own options, mouse on there only, the desktop session untouched. Use this as
# the host's startup command (Termius: startup snippet; Blink: after
# `mosh <box> --`), naming the session qkvps attaches to (default: claude):
#   tmux new -A -s phone -t claude \; set mouse on
# tmux-resurrect restores grouped sessions but not their options, which is why
# `set mouse on` rides along on every attach. Swipe then scrolls history;
# long-press copies what is on screen natively; for longer text use copy-mode
# (swipe up, Space, Enter) and OSC 52 puts it on the phone clipboard.

# Terminal owns the mouse -> native selection + Cmd+C / Cmd+V.
set -g mouse off

# Copy-mode copies also set the system clipboard through OSC 52. mosh 1.4.0
# (Homebrew and Ubuntu 24.04 alike) only passes the `c;` clipboard-selection
# form and silently drops tmux's default empty one, so name the selection
# explicitly. tmux 3.4 refuses an Ms that never references %p1 ("could not
# expand Ms", tmux/tmux#4081), hence the zero-width %p1%.0s.
set -g set-clipboard on
set -ga terminal-overrides ',*:Ms=\E]52;c%p1%.0s;%p2%s\007'

# Termius sends PageUp for a two-finger swipe and puts PgUp on its key row. In a
# session with the mouse on (a phone, see header) PageUp scrolls history;
# anywhere else it goes to the application untouched.
bind -n PageUp if -F '#{mouse}' 'copy-mode -eu' 'send-keys PageUp'

# Roomier scrollback (matters more now that scrolling is keyboard-driven).
set -g history-limit 50000

# --- session persistence across reboots (tmux-resurrect + tmux-continuum) ---
# resurrect: prefix + Ctrl-s to save, prefix + Ctrl-r to restore.
# continuum: auto-saves every 15 min and auto-restores when the tmux server
# starts (i.e. the first `qkvps` after a reboot brings your windows back). Panes
# come back as shells in their original cwd — Claude is NOT auto-relaunched
# (avoids a memory stampede on boot); reopen it with `claude --resume`.
# Guarded with if-shell so this shared file is a harmless no-op on machines
# without the plugins (e.g. the Mac); the box has them under ~/.tmux/plugins/.
if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' 'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]' 'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
